# /etc/nginx/sites-available/cuerdabajo.com
# Sitio estático de Astro (dist/) servido desde /var/www/cuerdabajo
# SSL con Certificado de Origen de Cloudflare (modo Full strict).

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cuerdabajo.com www.cuerdabajo.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cuerdabajo.com www.cuerdabajo.com;

    # Certificado de Origen de Cloudflare (se crea en la fase de SSL)
    ssl_certificate     /etc/ssl/cloudflare/cuerdabajo.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cuerdabajo.key;

    root /var/www/cuerdabajo;
    index index.html;

    # Redirige www -> raíz (opcional)
    if ($host = www.cuerdabajo.com) { return 301 https://cuerdabajo.com$request_uri; }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
