# /etc/nginx/sites-available/cuerdabajo.com
# Sitio estático de Astro servido desde VPS_PATH (p. ej. /var/www/cuerdabajo)

server {
    listen 80;
    listen [::]:80;
    server_name cuerdabajo.com www.cuerdabajo.com;

    root /var/www/cuerdabajo;
    index index.html;

    # Rutas de Astro (build estático genera carpetas con index.html)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache de assets con hash
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache de imágenes/fuentes
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
